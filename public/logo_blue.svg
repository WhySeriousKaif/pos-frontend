<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
    <defs>
        <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect x="0" y="0" width="500" height="500" rx="100" ry="100" fill="url(#blueGrad)" />

    <!-- POS Device Icon -->
    <g transform="translate(125, 100) scale(2.5)">
        <!-- Main Body -->
        <rect x="20" y="20" width="60" height="80" rx="5" fill="#ffffff" />

        <!-- Screen -->
        <rect x="25" y="30" width="50" height="35" fill="#3b82f6" />

        <!-- Buttons -->
        <circle cx="35" cy="80" r="3" fill="#cbd5e1" />
        <circle cx="50" cy="80" r="3" fill="#cbd5e1" />
        <circle cx="65" cy="80" r="3" fill="#cbd5e1" />
        <circle cx="35" cy="90" r="3" fill="#cbd5e1" />
        <circle cx="50" cy="90" r="3" fill="#cbd5e1" />
        <circle cx="65" cy="90" r="3" fill="#cbd5e1" />

        <!-- Receipt -->
        <path d="M30 20 L30 5 L70 5 L70 20 Z" fill="#f1f5f9" />
        <line x1="35" y1="10" x2="65" y2="10" stroke="#94a3b8" stroke-width="2" />
        <line x1="35" y1="15" x2="55" y2="15" stroke="#94a3b8" stroke-width="2" />
    </g>

    <!-- Text -->
    <text x="50%" y="420" font-family="Arial, sans-serif" font-weight="bold" font-size="60"
        fill="#ffffff" text-anchor="middle">POS Pro</text>
</svg>